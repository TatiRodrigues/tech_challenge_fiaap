services:
  # Banco de dados MongoDB
  mongo:
    image: mongo:7.0
    container_name: tech-challenge-mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=senha123
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    networks:
      - tech-challenge-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend BFF - Desenvolvimento (Porta 3000)
  bff:
    build:
      context: ../tech-challenge-2
      dockerfile: Dockerfile.dev
    container_name: tech-challenge-bff
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - MONGODB_URI=mongodb://admin:senha123@mongo:27017/tech-challenge?authSource=admin
    volumes:
      - ../tech-challenge-2:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - mongo
    restart: unless-stopped
    networks:
      - tech-challenge-network
    command: npm run dev

  # Frontend Next.js - Desenvolvimento (Porta 3001)
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: tech-challenge-app
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:3000
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - bff
    restart: unless-stopped
    networks:
      - tech-challenge-network
    command: npm run dev

networks:
  tech-challenge-network:
    driver: bridge

volumes:
  mongo-data:
