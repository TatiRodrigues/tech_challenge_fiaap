services:
  # Banco de dados MongoDB
  mongo:
    image: mongo:4.4
    container_name: tech-challenge-mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=senha123
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    networks:
      - tech-challenge-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval \"db.runCommand('ping').ok\" || mongo --eval \"db.runCommand('ping').ok\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Backend BFF - Desenvolvimento (Porta 3000)
  bff:
    build:
      context: ../tech-challenge-2
      dockerfile: Dockerfile.dev
    container_name: tech-challenge-bff
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - MONGO_URI=mongodb://admin:senha123@mongo:27017/tech-challenge?authSource=admin
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ../tech-challenge-2:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tech-challenge-network
    command: npm run dev -- --legacy-watch
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Frontend Next.js - Desenvolvimento (Porta 3001)
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: tech-challenge-app
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      # Usado pelo browser (client-side): acessa o BFF via porta mapeada no host
      - NEXT_PUBLIC_API_URL=http://localhost:3000
      # Usado pelo Next.js no servidor (SSR): acessa o BFF pelo nome do serviço interno
      - API_URL=http://bff:3000
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      bff:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tech-challenge-network
    command: npm run dev

networks:
  tech-challenge-network:
    driver: bridge

volumes:
  mongo-data:
