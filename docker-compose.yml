services:
  # MongoDB
  mongo:
    image: mongo:6
    container_name: alecrim-mongo
    ports:
      - '27017:27017'
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=senha123
      - MONGO_INITDB_DATABASE=tech-challenge
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    networks:
      - alecrim-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" || mongo --quiet --eval \"db.adminCommand('ping').ok\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # BFF Node.js
  bff:
    build:
      context: ../tech-challenge-2
      dockerfile: Dockerfile.dev
    container_name: alecrim-bff
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
      - PORT=3000
      - MONGO_URI=mongodb://admin:senha123@mongo:27017/tech-challenge?authSource=admin
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - alecrim-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 60s

  # Frontend Next.js
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: alecrim-app
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=development
      - PORT=3001
      - API_BACKEND_URL=http://bff:3000
    depends_on:
      bff:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - alecrim-network

networks:
  alecrim-network:
    driver: bridge

volumes:
  mongo-data:
