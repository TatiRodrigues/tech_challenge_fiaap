services:
  # Banco de dados MongoDB
  mongo:
    image: mongo:4.4
    container_name: tech-challenge-mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=senha123
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    networks:
      - tech-challenge-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval \"db.runCommand('ping').ok\" || mongo --eval \"db.runCommand('ping').ok\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Backend BFF - Desenvolvimento (Porta 3000)
  bff:
    build:
      context: ../tech-challenge-2
      dockerfile: Dockerfile.dev
    container_name: tech-challenge-bff
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - MONGO_URI=mongodb://admin:senha123@mongo:27017/tech-challenge?authSource=admin
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ../tech-challenge-2:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tech-challenge-network
    command: npm run dev -- --legacy-watch
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/', (r) => process.exit(0)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 8s
      retries: 15
      start_period: 60s

  # Frontend Next.js - Desenvolvimento (Porta 3001)
  # Sem volume mounts para evitar problemas de permissao no Windows
  # Hot-reload nao disponivel; use --build para recompilar apos mudancas
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: tech-challenge-app
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      # URL interna do container bff (server-side; sem NEXT_PUBLIC_)
      - API_BACKEND_URL=http://bff:3000
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped
    networks:
      - tech-challenge-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 90s

networks:
  tech-challenge-network:
    driver: bridge

volumes:
  mongo-data:
