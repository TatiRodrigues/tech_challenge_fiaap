# Override para uso quando o projeto está em OneDrive ou rede mapeada.
# Remove os volume mounts do código fonte para evitar erros EIO do Docker
# ao tentar ler arquivos placeholder do OneDrive dentro do container Linux.
#
# Uso: docker compose -f docker-compose.yml -f docker-compose.override.yml up --build
#
# Atenção: hot-reload não funciona com este override. Reconstrua a imagem
# (--build) sempre que alterar o código.

services:
  app:
    volumes:
      - /app/node_modules
      - /app/.next

  bff:
    volumes:
      - /usr/src/app/node_modules
