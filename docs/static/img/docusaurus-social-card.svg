  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066CC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0052A3;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Main Text -->
  <text x="600" y="280" font-size="88" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Arial">Alecrim Finance</text>
  
  <!-- Subtitle -->
  <text x="600" y="380" font-size="48" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="rgba(255,255,255,0.9)" font-family="Arial">Documentação Completa</text>
  
  <!-- Decorative Element -->
  <circle cx="600" cy="480" r="3" fill="rgba(255,255,255,0.5)"/>
